<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ケーメックスONE_DEMOサイト</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: {
    colors: { brand:{DEFAULT:'#e60012',dark:'#cc0000'}, navy:'#393b56', ink:'#000000', paper:'#f8f8f8', lav:'#f0f0fa' },
    fontFamily: { sans:['"Noto Sans JP"','sans-serif'], display:['Roboto','"Noto Sans JP"','sans-serif'] },
  }}};
</script>
<link rel="stylesheet" href="assets/common.css">
</head>
<body>
<div id="content"><div id="page-body"></div></div>

<script src="assets/data.js"></script>
<script src="assets/shell.js"></script>
<script>
  // セミナー・ウェビナー詳細データ（実サイトの告知内容を反映）
  var SEMINARS = window.SEMINARS;

  var E = SEMINARS[qs('id')] || SEMINARS['iacs-e26'];

  KMECS.renderUserShell({
    active:'event',
    crumbs:[{label:'トップ',href:'index.html'},{label:'セミナー・イベント',href:'event.html'},{label:E.title}],
    onReady:function(){
      function modeBadge(){ return E.mode==='オンライン'
        ? '<span class="badge text-white" style="background:#393b56">'+E.mode+(E.tool&&E.tool!=='—'?'（'+E.tool+'）':'')+'</span>'
        : '<span class="badge bg-ink text-white">'+E.mode+'</span>'; }
      var dd = E.date.split('.');
      // セミナー申込は外部フォーム（skylake）へ。※現在リンク切れ・暫定
      var applyUrl = 'https://skylake.kmecsone.jp/public/application/add/4025';
      var applyBtn = '<a href="'+applyUrl+'" target="_blank" rel="noopener" class="btn-red !px-9 !py-3.5 !text-[16px]">無料で参加登録する</a>';

      var html =
        // ヒーロー
        '<section class="relative text-white overflow-hidden" style="background:#0d1024">'
        + '<img src="'+E.img+'" alt="" class="absolute inset-0 w-full h-full object-cover" style="opacity:.4;object-position:center 40%">'
        + '<div class="absolute inset-0" style="background:linear-gradient(90deg,rgba(13,16,36,.92),rgba(13,16,36,.5))"></div>'
        + '<div class="relative max-w-[1000px] mx-auto px-4 xl:px-8 py-14 sm:py-16">'
        + '<a href="event.html" class="inline-flex items-center gap-1 text-[13px] text-neutral-300 hover:text-white mb-4">‹ セミナー・イベント一覧へ</a>'
        + '<div class="flex items-center gap-2 flex-wrap"><span class="badge text-white" style="background:#e60012">'+E.tag+'</span>'+modeBadge()+'<span class="badge bg-white/90 text-ink">参加費 '+E.fee+'</span></div>'
        + '<div class="sec-label text-neutral-300 mt-5">'+E.sub+'</div>'
        + '<h1 class="text-2xl sm:text-4xl font-bold mt-2 leading-snug">'+E.title+'</h1>'
        + '<div class="mt-5 flex flex-wrap items-center gap-x-6 gap-y-2 text-[15px]">'
        + '<span class="font-display font-black text-2xl">'+dd[0]+'.<span style="color:#ff5566">'+dd[1]+'.'+dd[2]+'</span>'+(E.dow?' <span class="text-base">'+E.dow+'</span>':'')+'</span>'
        + '<span class="text-neutral-200">'+E.time+(E.span&&E.span!=='—'?'（'+E.span+'）':'')+'</span></div>'
        + '<div class="mt-6">'+applyBtn+'</div></div></section>'

        + '<div class="max-w-[1000px] mx-auto px-4 xl:px-8 py-14">'
        + '<p class="text-[16px] text-neutral-700 leading-loose mb-12">'+E.lead+'</p>';

      // このセミナーで分かること
      if(E.goals && E.goals.length){
        html += '<section class="mb-12"><div class="sec-label" style="color:#e60012">GOAL</div><h2 class="text-xl font-bold text-ink mt-1 mb-4">このセミナーで分かること</h2>'
          + '<div class="grid sm:grid-cols-2 gap-3">'
          + E.goals.map(function(g){ return '<div class="card p-4 flex gap-3"><span class="w-6 h-6 rounded-full flex items-center justify-center text-white text-[13px] shrink-0" style="background:#e60012"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg></span><span class="text-[15px] text-neutral-700 leading-relaxed">'+g+'</span></div>'; }).join('')
          + '</div></section>';
      }
      // 対象
      if(E.target && E.target.length){
        html += '<section class="mb-12"><div class="sec-label" style="color:#e60012">TARGET</div><h2 class="text-xl font-bold text-ink mt-1 mb-4">こんな方におすすめ</h2>'
          + '<ul class="space-y-2 text-[15px] text-neutral-700">'
          + E.target.map(function(t){ return '<li class="flex gap-2"><span style="color:#e60012">●</span><span>'+t+'</span></li>'; }).join('')
          + '</ul></section>';
      }
      // プログラム
      if(E.program && E.program.length){
        html += '<section class="mb-12"><div class="sec-label" style="color:#e60012">PROGRAM</div><h2 class="text-xl font-bold text-ink mt-1 mb-4">プログラム・内容</h2>'
          + '<ol class="relative border-l-2 border-[color:var(--line)] ml-2 space-y-5">'
          + E.program.map(function(p,i){ return '<li class="pl-6 relative"><span class="absolute -left-[9px] top-1 w-4 h-4 rounded-full text-white text-[10px] flex items-center justify-center font-bold" style="background:#e60012">'+(i+1)+'</span>'
            + '<div class="text-[16px] font-bold text-ink">'+p.t+'</div><p class="text-[14px] text-neutral-600 mt-1 leading-relaxed">'+p.d+'</p></li>'; }).join('')
          + '</ol></section>';
      }
      // ソリューション紹介
      if(E.solutions && E.solutions.length){
        html += '<section class="mb-12"><div class="sec-label" style="color:#e60012">SOLUTION</div><h2 class="text-xl font-bold text-ink mt-1 mb-4">ご紹介するソリューション</h2>'
          + '<div class="grid sm:grid-cols-2 gap-4">'
          + E.solutions.map(function(s){ return '<div class="card p-5"><div class="text-[16px] font-bold text-ink">'+s.n+'</div><p class="text-[14px] text-neutral-600 mt-1.5 leading-relaxed">'+s.d+'</p></div>'; }).join('')
          + '</div></section>';
      }
      // 登壇者
      if(E.speakers && E.speakers.length){
        html += '<section class="mb-12"><div class="sec-label" style="color:#e60012">SPEAKER</div><h2 class="text-xl font-bold text-ink mt-1 mb-4">登壇者</h2>'
          + '<div class="grid sm:grid-cols-2 gap-4">'
          + E.speakers.map(function(s){ return '<div class="card p-5 flex gap-4 items-start">'
            + '<span class="w-14 h-14 rounded-full flex items-center justify-center text-white font-bold text-lg shrink-0" style="background:#22243a">'+(s.name.replace(/^ゲスト：/,'').charAt(0))+'</span>'
            + '<div><div class="text-[16px] font-bold text-ink">'+s.name+'</div>'+(s.org?'<div class="text-[13px] text-neutral-500 mt-0.5">'+s.org+'</div>':'')+'<p class="text-[13px] text-neutral-600 mt-1.5 leading-relaxed">'+s.role+'</p></div></div>'; }).join('')
          + '</div></section>';
      }
      // 参加フロー
      html += '<section class="mb-12"><div class="sec-label" style="color:#e60012">FLOW</div><h2 class="text-xl font-bold text-ink mt-1 mb-4">お申し込みの流れ</h2>'
        + '<div class="grid sm:grid-cols-3 gap-4">'
        + [['1','フォームから参加登録','必要事項をご入力ください。'],['2','視聴用URLを受け取る','登録後、視聴用URLをメールでお送りします。'],['3','当日ご視聴','当日、URLからアクセスしてご視聴ください。']].map(function(f){
            return '<div class="card p-5 text-center"><div class="font-display font-black text-3xl" style="color:#e60012">'+f[0]+'</div><div class="text-[15px] font-bold text-ink mt-2">'+f[1]+'</div><p class="text-[13px] text-neutral-500 mt-1.5 leading-relaxed">'+f[2]+'</p></div>'; }).join('')
        + '</div></section>';
      // FAQ
      if(E.faq && E.faq.length){
        html += '<section class="mb-12"><div class="sec-label" style="color:#e60012">FAQ</div><h2 class="text-xl font-bold text-ink mt-1 mb-4">よくあるご質問</h2>'
          + '<div id="sfaq" class="divide-y divide-[color:var(--line)] border-y border-[color:var(--line)]">'
          + E.faq.map(function(x,i){ return '<div><button class="sq w-full flex items-start gap-3 text-left py-4" data-i="'+i+'"><span class="font-display font-bold shrink-0" style="color:#e60012">Q</span><span class="flex-1 text-[16px] font-bold text-ink">'+x.q+'</span><span class="si shrink-0 text-neutral-400 transition-transform"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></span></button><div class="sa hidden pb-4 pl-7"><p class="text-[15px] text-neutral-600 leading-relaxed">'+x.a+'</p></div></div>'; }).join('')
          + '</div></section>';
      }
      // 申込CTA
      html += '<section class="text-white text-center p-10" style="background:#e60012">'
        + '<h2 class="text-2xl font-bold">'+E.title+'</h2>'
        + '<p class="text-[15px] opacity-90 mt-2">'+E.date.replace(/\./g,'/')+(E.dow?'（'+E.dow+'）':'')+'　'+E.time+'　'+E.mode+'　参加費 '+E.fee+'　主催：'+E.host+'</p>'
        + '<div class="mt-5"><a href="'+applyUrl+'" target="_blank" rel="noopener" class="inline-flex items-center gap-2 bg-white font-bold text-[16px] px-9 py-3.5" style="color:#e60012">無料ウェビナーに申し込む ›</a></div>'
        + '<p class="text-[12px] opacity-80 mt-4">※ 本ページはモックのため、実際の申し込み・配信は行われません。同業者様のお申し込みはお断りする場合がございます。</p>'
        + '</section>'
        + '</div>';

      document.getElementById('page-body').innerHTML = html;

      // FAQ アコーディオン
      document.querySelectorAll('#sfaq .sq').forEach(function(b){
        b.addEventListener('click', function(){
          var box=b.parentNode.querySelector('.sa'); var ic=b.querySelector('.si');
          var open=box.classList.toggle('hidden'); ic.style.transform = open ? '' : 'rotate(180deg)';
        });
      });
    }
  });
</script>
</body>
</html>
